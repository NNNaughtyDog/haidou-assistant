name: Deploy GitHub Pages

on:
  push:
    branches: [feat/full-item-library]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Promote tested static bundle
        shell: bash
        run: |
          cat deploy/artifacts/haidou-v0.2.1.tar.gz.b64.part-* \
            | base64 --decode > /tmp/haidou-v0.2.1.tar.gz
          printf '%s  %s\n' \
            "$(tr -d '[:space:]' < deploy/artifacts/haidou-current.sha256)" \
            '/tmp/haidou-v0.2.1.tar.gz' | sha256sum --check -
          install -d /tmp/haidou-pages
          tar -xzf /tmp/haidou-v0.2.1.tar.gz -C /tmp/haidou-pages
          sed -i 's#="/#="/haidou-assistant/#g' /tmp/haidou-pages/index.html
          test -s /tmp/haidou-pages/index.html
          grep -Rqs '海斗助手' /tmp/haidou-pages/assets
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/haidou-pages

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
