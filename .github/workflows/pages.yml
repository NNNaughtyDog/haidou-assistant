name: Deploy GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Promote tested static bundle
        shell: bash
        run: |
          cat deploy/artifacts/haidou-v0.2.1.tar.gz.b64.part-* \
            | base64 --decode > /tmp/haidou-v0.2.1.tar.gz
          printf '%s  %s\n' \
            '80233d748a2f005a614a3c5a07beb44ae716ddf6fa58bf1afd09126251cae702' \
            '/tmp/haidou-v0.2.1.tar.gz' | sha256sum --check -
          install -d /tmp/haidou-pages
          tar -xzf /tmp/haidou-v0.2.1.tar.gz -C /tmp/haidou-pages
          sed -i 's#/haidou-assistant/docs/preview/v0.2.1/#/haidou-assistant/#g' /tmp/haidou-pages/index.html
          mv /tmp/haidou-pages/assets/index-D9kNGRjE.js \
            /tmp/haidou-pages/assets/index-D9kNGRjE-80233d74.js
          sed -i 's#index-D9kNGRjE.js#index-D9kNGRjE-80233d74.js#g' /tmp/haidou-pages/index.html
          test -f /tmp/haidou-pages/assets/index-D9kNGRjE-80233d74.js
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/haidou-pages

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
