name: Deploy GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Promote tested static bundle
        shell: bash
        run: |
          install -d /tmp/haidou-pages
          cp -R docs/preview/v0.2.1/. /tmp/haidou-pages/
          sed -i 's#/haidou-assistant/docs/preview/v0.2.1/#/haidou-assistant/#g' /tmp/haidou-pages/index.html
          test -f /tmp/haidou-pages/assets/index-D9kNGRjE.js
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/haidou-pages

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
