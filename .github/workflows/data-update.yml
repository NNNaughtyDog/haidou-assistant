name: Update game data

on:
  schedule:
    # Every three hours; minute 17 avoids the busiest top-of-hour queue.
    - cron: "17 */3 * * *"
  push:
    branches: [main]
    paths:
      - "scripts/*.mjs"
      - "tests/*.test.mjs"
      - "package.json"
      - ".github/workflows/data-update.yml"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: tencent-lighthouse-production
  cancel-in-progress: false

env:
  DEPLOY_HOST: 43.133.254.212
  DEPLOY_USER: root

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: github-pages/package-lock.json

      - name: Preserve reliable baselines
        run: |
          cp app/aramgg-snapshot.ts /tmp/aramgg-baseline.ts
          cp app/item-snapshot.ts /tmp/item-baseline.ts

      - name: Synchronize all public data
        id: sync
        run: npm run data:sync

      - name: Report delayed source
        if: steps.sync.outputs.degraded == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const title = "⚠️ 海斗助手部分数据源同步延迟";
            const failed = `${{ steps.sync.outputs.failed_sources }}`;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `数据源 ${failed} 本轮同步失败，已自动恢复该源上一份可靠快照；其他数据源继续更新。系统会在下一轮自动重试。\n\n运行日志：${runUrl}`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: "open", per_page: 100,
            });
            const existing = issues.find((issue) => !issue.pull_request && issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo, title, body, assignees: [context.repo.owner],
              });
            }

      - name: Close resolved source-delay alert
        if: steps.sync.outputs.degraded == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const title = "⚠️ 海斗助手部分数据源同步延迟";
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: "open", per_page: 100,
            });
            const existing = issues.find((issue) => !issue.pull_request && issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number,
                body: "两个数据源均已恢复正常，自动关闭告警。",
              });
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, state: "closed",
              });
            }

      - name: Validate version, coverage and drift
        run: npm run data:validate -- --baseline-aramgg /tmp/aramgg-baseline.ts --baseline-items /tmp/item-baseline.ts

      - name: Detect changes
        id: changes
        shell: bash
        run: |
          if git diff --quiet -- app/aramgg-snapshot.ts app/hexdata-snapshot.ts app/item-snapshot.ts; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "数据源没有变化；仍核对并恢复生产部署。" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Update changelog
        if: steps.changes.outputs.changed == 'true'
        run: npm run data:changelog

      - name: Install production dependencies
        run: npm ci --prefix github-pages --no-audit --no-fund

      - name: Run data regression tests
        run: node --test tests/*.test.mjs

      - name: Build Tencent production bundle
        env:
          HAIDOU_BASE: /
        run: |
          npm --prefix github-pages run build
          npm --prefix github-pages run test:render
          test -s github-pages/dist/index.html
          grep -Rqs '海斗助手' github-pages/dist/assets
          tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner -C github-pages/dist -cf - . | gzip -n > /tmp/haidou-current.tar.gz
          rm -f deploy/artifacts/haidou-current.tar.gz.b64.part-*
          base64 -w 0 /tmp/haidou-current.tar.gz \
            | split -b 700000 -a 2 - deploy/artifacts/haidou-current.tar.gz.b64.part-
          sha256sum /tmp/haidou-current.tar.gz | awk '{print $1}' \
            > deploy/artifacts/haidou-current.sha256

      - name: Commit and publish verified update
        id: publish
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/aramgg-snapshot.ts app/hexdata-snapshot.ts app/item-snapshot.ts CHANGELOG.md deploy/artifacts
          if ! git diff --cached --quiet; then
            git commit -m "data: automatic game data refresh"
            git push origin HEAD:main
          fi
          echo "release_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Verify production DNS for data release
        shell: bash
        run: |
          for attempt in $(seq 1 20); do
            resolved="$(getent ahostsv4 hex.aicollie.cn | awk '{print $1}' | sort -u || true)"
            if printf '%s\n' "$resolved" | grep -Fx "$DEPLOY_HOST"; then
              exit 0
            fi
            sleep 15
          done
          exit 1

      - name: Prepare SSH for data release
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SEOUL_SSH_KEY }}
        run: |
          test -n "$SSH_PRIVATE_KEY"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" | sed 's/\r$//' > "$HOME/.ssh/haidou_deploy_key"
          chmod 600 "$HOME/.ssh/haidou_deploy_key"
          ssh-keyscan -H "$DEPLOY_HOST" > "$HOME/.ssh/known_hosts"

      - name: Upload verified data release
        shell: bash
        run: |
          release_sha="${{ steps.publish.outputs.release_sha }}"
          test -n "$release_sha"
          for attempt in 1 2 3; do
            if timeout 120 scp -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=2 \
              -i "$HOME/.ssh/haidou_deploy_key" \
              /tmp/haidou-current.tar.gz \
              "${DEPLOY_USER}@${DEPLOY_HOST}:/tmp/haidou-${release_sha}.tar.gz" \
              && timeout 30 scp -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=2 \
                -i "$HOME/.ssh/haidou_deploy_key" \
                deploy/nginx/haidou-assistant.conf \
                "${DEPLOY_USER}@${DEPLOY_HOST}:/tmp/haidou-assistant.conf"; then
              exit 0
            fi
            echo "上传失败，第 ${attempt}/3 次；稍后自动重试。" >&2
            sleep "$((attempt * 10))"
          done
          exit 1

      - name: Activate verified data release
        shell: bash
        run: |
          ssh -i "$HOME/.ssh/haidou_deploy_key" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "RELEASE_SHA='${{ steps.publish.outputs.release_sha }}' bash -s" < deploy/tencent-lighthouse.sh

      - name: Verify production data release
        shell: bash
        run: |
          node scripts/verify-production.mjs github-pages/dist https://hex.aicollie.cn

      - name: Close resolved update-failure alert
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const title = "🚨 海斗助手数据自动更新失败";
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: "open", per_page: 100,
            });
            const existing = issues.find((issue) => !issue.pull_request && issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number,
                body: "数据同步、校验和自动发布均已恢复正常，自动关闭告警。",
              });
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, state: "closed",
              });
            }

  notify-failure:
    needs: update
    if: ${{ always() && needs.update.result == 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - name: Create or update failure alert
        uses: actions/github-script@v7
        with:
          script: |
            const title = "🚨 海斗助手数据自动更新失败";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `数据抓取、校验、构建或自动提交失败。线上可靠版本未被替换。\n\n失败时间：${new Date().toISOString()}\n运行日志：${runUrl}`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100,
            });
            const existing = issues.find((issue) => !issue.pull_request && issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                assignees: [context.repo.owner],
              });
            }
