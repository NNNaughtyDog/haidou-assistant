name: Validate CN sources
on:
  push:
    branches: [fix/cn-source-recovery]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - name: Inspect Tencent public data endpoints
        run: |
          node --input-type=module <<'JS'
          const url='https://lol.qq.com/lolstrategy/assets/20260902/strategy-BS2LPLRo.js';
          const r=await fetch(url,{signal:AbortSignal.timeout(20000)});
          const value=await r.text();
          console.log('PUBLIC_SOURCE','officialjs',r.status,Buffer.from(value).toString('base64'));
          JS
