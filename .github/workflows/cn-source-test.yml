name: Validate CN sources
on:
  push:
    branches: [fix/cn-source-recovery]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - name: Inspect official CN schemas
        run: |
          node --input-type=module <<'JS'
          for (const [key,url] of Object.entries({rankjs:'https://lol.qq.com/lolstrategy/assets/20260902/HextechRankView-BudBkGWB.js',herojs:'https://lol.qq.com/lolstrategy/assets/20260902/HeroDetailView-dX_tkxda.js',qqitems:'https://game.gtimg.cn/images/lol/act/img/js/items/items.js'})) {
            const r=await fetch(url,{signal:AbortSignal.timeout(20000)});
            console.log('PUBLIC_SOURCE',key,r.status,Buffer.from(await r.text()).toString('base64'));
          }
          JS
