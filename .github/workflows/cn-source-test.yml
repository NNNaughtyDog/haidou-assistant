name: Validate CN sources
on:
  push:
    branches: [fix/cn-source-recovery]
    paths: ["scripts/**", "tests/**", "app/game-data.ts", "app/page.tsx", ".github/workflows/cn-source-test.yml"]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - name: Synchronize real CN sources
        run: |
          npm run data:sync
          node --input-type=module <<'JS'
          import {readFileSync} from 'node:fs';
          import {readConst} from './scripts/public-data-fetch.mjs';
          const cn=readConst(readFileSync('app/aramgg-snapshot.ts','utf8'),'aramggSnapshot');
          const pools=readConst(readFileSync('app/hexdata-snapshot.ts','utf8'),'hexdataSnapshot');
          if(pools.region!=='CN'||pools.patch!==cn.patch||pools.date!==cn.date)throw new Error('CN candidate refresh did not succeed');
          JS
      - name: Validate data and regressions
        run: |
          npm run data:validate
          node --test tests/*.test.mjs
      - name: Build and render production app
        env:
          HAIDOU_BASE: /
        run: |
          npm ci --prefix github-pages --no-audit --no-fund
          npm --prefix github-pages run build
          npm --prefix github-pages run test:render
      - name: Save verified CN snapshots
        run: |
          npm run data:changelog
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/aramgg-snapshot.ts app/hexdata-snapshot.ts app/item-snapshot.ts CHANGELOG.md
          if ! git diff --cached --quiet; then
            git commit -m "data: verified CN candidates and current official items"
            git push origin HEAD:fix/cn-source-recovery
          fi
