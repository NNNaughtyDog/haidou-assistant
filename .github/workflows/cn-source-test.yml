name: Validate CN sources
on:
  push:
    branches: [fix/cn-source-recovery]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - name: Inspect public CN datasets
        run: |
          node --input-type=module <<'JS'
          for (const [key,url] of Object.entries({detail:'https://aramgg.com/data/champion-details/1.json',catalog:'https://aramgg.com/data/aram-mayhem-augments.zh_cn.json',items:'https://ddragon.leagueoflegends.com/cdn/16.17.1/data/zh_CN/item.json'})) {
            const r=await fetch(url,{signal:AbortSignal.timeout(20000)});
            const value=await r.text();
            console.log('PUBLIC_SOURCE',key,r.status,Buffer.from(value).toString('base64'));
          }
          JS
