name: Deploy Tencent Lighthouse

on:
  push:
    branches: [main, ops/hex-domain]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: tencent-lighthouse-production
  cancel-in-progress: true

env:
  DEPLOY_HOST: 43.133.254.212
  DEPLOY_USER: root

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Promote tested static bundle
        shell: bash
        run: |
          cat deploy/artifacts/haidou-current.tar.gz.b64.part-* \
            | base64 --decode > /tmp/haidou-current.tar.gz
          expected="$(cat deploy/artifacts/haidou-current.sha256)"
          printf '%s  %s\n' "$expected" '/tmp/haidou-current.tar.gz' | sha256sum --check -
          install -d /tmp/haidou-dist
          tar -xzf /tmp/haidou-current.tar.gz -C /tmp/haidou-dist
          test -s /tmp/haidou-dist/index.html
          grep -Rqs '海斗助手' /tmp/haidou-dist/assets

      - name: Verify production DNS
        shell: bash
        run: |
          for attempt in $(seq 1 40); do
            resolved="$(getent ahostsv4 hex.aicollie.cn | awk '{print $1}' | sort -u || true)"
            printf 'DNS attempt %s/40: %s\n' "$attempt" "${resolved:-not resolved}"
            if printf '%s\n' "$resolved" | grep -Fx "$DEPLOY_HOST"; then
              exit 0
            fi
            sleep 15
          done
          exit 1

      - name: Prepare SSH
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SEOUL_SSH_KEY }}
        run: |
          test -n "$SSH_PRIVATE_KEY"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" | sed 's/\r$//' > "$HOME/.ssh/haidou_deploy_key"
          chmod 600 "$HOME/.ssh/haidou_deploy_key"
          ssh-keyscan -H "$DEPLOY_HOST" > "$HOME/.ssh/known_hosts"

      - name: Package and upload release
        shell: bash
        run: |
          tar -C /tmp/haidou-dist -czf "/tmp/haidou-${GITHUB_SHA}.tar.gz" .
          scp -i "$HOME/.ssh/haidou_deploy_key" \
            "/tmp/haidou-${GITHUB_SHA}.tar.gz" \
            "${DEPLOY_USER}@${DEPLOY_HOST}:/tmp/haidou-${GITHUB_SHA}.tar.gz"
          scp -i "$HOME/.ssh/haidou_deploy_key" \
            deploy/nginx/haidou-assistant.conf \
            "${DEPLOY_USER}@${DEPLOY_HOST}:/tmp/haidou-assistant.conf"

      - name: Activate release and configure HTTPS
        shell: bash
        run: |
          ssh -i "$HOME/.ssh/haidou_deploy_key" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "RELEASE_SHA='${GITHUB_SHA}' bash -s" < deploy/tencent-lighthouse.sh

      - name: Verify production
        shell: bash
        run: |
          curl --fail --location --retry 8 --retry-delay 3 --max-time 20 \
            https://hex.aicollie.cn/ | grep -F '海斗助手' > /dev/null

  notify-failure:
    needs: deploy
    if: ${{ always() && needs.deploy.result == 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - name: Create or update deployment alert
        uses: actions/github-script@v7
        with:
          script: |
            const title = "🚨 海斗助手腾讯云部署失败";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `新版未能完成腾讯云部署或线上验证。服务器会保留上一份可靠版本。\n\n失败时间：${new Date().toISOString()}\n运行日志：${runUrl}`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100,
            });
            const existing = issues.find((issue) => !issue.pull_request && issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
            }
