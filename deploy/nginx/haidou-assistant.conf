server {
    listen 80;
    listen [::]:80;
    server_name hex.aicollie.cn;

    root /var/www/haidou-assistant/current;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|jpg|jpeg|png|svg|ico|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}

server {
    listen 80;
    listen [::]:80;
    server_name aicollie.cn www.aicollie.cn;

    return 301 https://hex.aicollie.cn$request_uri;
}
